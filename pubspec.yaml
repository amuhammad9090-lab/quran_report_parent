name: quran_report_parent_web
description: >
  Portal Orang Tua — companion Flutter Web read-only app untuk Quran
  Report (app guru). Menampilkan perkembangan hafalan/tahsin santri
  kepada orang tua. TIDAK ADA fitur tulis (create/update/delete).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Dependency di bawah ini SENGAJA dipilih supaya identik dengan
  # subset yang dipakai app guru untuk bagian yang di-*share* (theme,
  # models, engine, hashing).
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

  # --- Firestore (STEP 10) --- AKTIF, project Firebase sudah ada
  # (quran-reportweb).
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
