<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Quran Report — Portal Orang Tua">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7C61">
  <title>Quran Report — Portal Orang Tua</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    /* Splash — tampil dari awal HTML load sampai frame pertama Flutter
       selesai digambar (event `flutter-first-frame`), bukan cuma sampai
       script-nya kebaca. Background putih biar senada sama kartu putih
       di dalam icon-nya sendiri (sama kayak splash Android). */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.35s ease;
      z-index: 9999;
    }
    #splash img {
      width: 148px;
      height: 148px;
    }
    #splash.splash-hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Portal Orang Tua"></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter men-dispatch event ini ke `window` persis setelah frame
    // pertama selesai dirender — jadi splash baru hilang begitu UI asli
    // beneran siap ditampilkan, bukan tebak-tebakan pakai setTimeout.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash-hide');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
</body>
</html>
